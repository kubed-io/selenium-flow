description: >-
  Sign in to the admin page and find the workspace running this flow in its list.
  This is the admin UI's whole front door: the list went blank in production
  while every unit test stayed green.
parameters:
  type: object
  required: [admin, workspace]
  properties:
    admin:
      type: string
      description: The origin the browser reaches this server at
    workspace:
      type: string
      description: The name the caller running this flow gave its workspace
steps:
- tool: navigate
  args:
    url: ${admin}/
- tool: write
  args:
    selector:
      css: "#token"
    secret:
      name: admin
      key: token
- tool: interact
  args:
    action: click
    selector:
      css: "#loginForm button[type=submit]"
- tool: assert
  args:
    script: >-
      return [...document.querySelectorAll('#workspaces .pill.name')]
      .some((pill) => pill.textContent === '${workspace}')
    message: >-
      Signed in, but the workspace running this flow is not in the list. Either
      /admin/workspaces came back empty or the page did not render what it got.
