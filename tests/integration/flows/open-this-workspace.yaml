description: >-
  Open this workspace from the admin list and see the shared flows in its detail
  view — including this one.
parameters:
  type: object
  required: [admin, workspace]
  properties:
    admin:
      type: string
      description: The origin the browser reaches this server at
    workspace:
      type: string
      description: The name the caller running this flow gave its workspace
steps:
- tool: navigate
  args:
    url: ${admin}/
- tool: write
  args:
    selector:
      css: "#token"
    secret:
      name: admin
      key: token
- tool: interact
  args:
    action: click
    selector:
      css: "#loginForm button[type=submit]"
- tool: interact
  args:
    action: click
    selector:
      xpath: //div[contains(@class, 'card')][.//span[contains(@class, 'name') and . = '${workspace}']]
- tool: interact
  args:
    action: click
    selector:
      css: "#tabFlows"
- tool: assert
  args:
    script: >-
      return [...document.querySelectorAll('#flowlist .item .nm')]
      .some((name) => name.textContent === 'open-this-workspace')
    message: >-
      The workspace opened, but its flows section does not list the shared flow
      that is running right now.
