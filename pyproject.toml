[project]
name = "kubed-selenium-flow"
description = "MCP server that drives a Selenium Grid browser, and serves the same actions as plain HTTP endpoints"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10.0"
keywords = ["mcp", "selenium", "browser-automation", "fastmcp", "ai"]
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
authors = [{ name = "Kelly", email = "admin@kellyferrone.com" }]
maintainers = [{ name = "Kelly", email = "admin@kellyferrone.com" }]
dependencies = [
  "fastmcp>=4.0.0,<5",
  "selenium>=4.48.0,<5",
  "requests>=2.32.0",
  "pyyaml>=6.0",
  # Starlette parses multipart forms with this, which /browser/upload needs to
  # accept a plain file. It arrives transitively today; declared because a
  # transitive dependency disappearing would break uploads at runtime only.
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Only needed to share saved sessions across replicas or across a restart. The
# image installs it so the feature is a config change, not a rebuild.
redis = [
  "redis>=5.0,<7",
]
build = [
  "setuptools_scm",
  "build",
  "wheel",
]
test = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "uvicorn",
  "openapi-spec-validator",
  "redis>=5.0,<7",
]

[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/kubed-io"
Repository = "https://github.com/kubed-io/selenium-flow"
Issues = "https://github.com/kubed-io/selenium-flow/issues"
Changelog = "https://github.com/kubed-io/selenium-flow/blob/main/CHANGELOG.md"

[project.scripts]
selenium-flow = "kubed.selenium_flow.main:main"

[tool.setuptools_scm]

[tool.setuptools]
packages = ["kubed.selenium_flow", "kubed.selenium_flow.skills"]

# The skill lives at the repo root, where it reads as documentation rather than
# as buried package data, but it has to INSTALL inside the package so it travels
# with the wheel. This maps the one to the other: built from ./skills, installed
# as kubed/selenium_flow/skills/. Without it the skill is simply absent from an
# installed package and silently does not exist.
[tool.setuptools.package-dir]
"kubed.selenium_flow.skills" = "skills"

# Everything under it, not just *.md: a supporting file of any other type would
# otherwise be missing from the wheel with no error at build or import time, and
# the skill would reference a file that is not there.
#
# The directory name IS the skill name — FastMCP's SkillProvider takes it from
# the folder, not the frontmatter, and publishes skill://<folder>/SKILL.md.
[tool.setuptools.package-data]
"kubed.selenium_flow.skills" = ["*", "**/*"]

[tool.pytest.ini_options]
minversion = "6.0"
asyncio_mode = "auto"
addopts = "--verbose"
testpaths = ["tests"]
markers = [
  "unit: mark a test as a unit test",
  "integration: mark a test as an integration test",
]

[tool.ruff]
exclude = ["tests/*"]
