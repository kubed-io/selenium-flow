[project]
name = "kubed-selenium-flow"
description = "MCP server that drives a Selenium Grid browser, and serves the same actions as plain HTTP endpoints"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10"
keywords = ["mcp", "selenium", "browser-automation", "fastmcp", "ai"]
license-files = ["LICENSE"]
# One entry per interpreter CI actually sweeps, so the metadata and
# .github/workflows/test.yml make the same claim. A bare "Python :: 3" tells an
# installer nothing it can act on.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing :: Acceptance",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Typing :: Typed",
]
authors = [{ name = "Kelly", email = "admin@kellyferrone.com" }]
maintainers = [{ name = "Kelly", email = "admin@kellyferrone.com" }]
dependencies = [
  "fastmcp>=4.0.0,<5",
  "selenium>=4.48.0,<5",
  "requests>=2.32.0",
  "pyyaml>=6.0",
  # Starlette parses multipart forms with this, which /browser/upload needs to
  # accept a plain file. It arrives transitively today; declared because a
  # transitive dependency disappearing would break uploads at runtime only.
  "python-multipart>=0.0.9",
  # errors.py catches urllib3's connection failures by type, because that is
  # what the Selenium driver surfaces when the Grid is unreachable. It arrives
  # with requests and selenium either way; declared because a module that
  # imports it should say so.
  "urllib3>=2.0",
]

[project.optional-dependencies]
# Only needed to share saved sessions across replicas or across a restart. The
# image installs it so the feature is a config change, not a rebuild.
redis = [
  "redis>=5.0,<9",
]
build = [
  "setuptools_scm",
  "build",
  "wheel",
  # Validates the built distribution's metadata before it can become a rejected
  # upload to a package index — the failure that otherwise only appears at
  # publish time. Used by .github/workflows/package.yml.
  "twine",
]
test = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "uvicorn",
  "openapi-spec-validator",
  "redis>=5.0,<9",
  # tests/test_packaging.py reads pyproject.toml. tomllib is 3.11+, so the
  # oldest supported interpreter needs the backport it was adopted from.
  "tomli; python_version < '3.11'",
]

[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/kubed-io"
Repository = "https://github.com/kubed-io/selenium-flow"
Issues = "https://github.com/kubed-io/selenium-flow/issues"
Changelog = "https://github.com/kubed-io/selenium-flow/blob/main/CHANGELOG.md"

[project.scripts]
selenium-flow = "kubed.selenium_flow.main:main"

[tool.setuptools_scm]

[tool.setuptools]
packages = [
  "kubed.selenium_flow",
  "kubed.selenium_flow.skills",
  "kubed.selenium_flow.static",
]

# The skill lives at the repo root, where it reads as documentation rather than
# as buried package data, but it has to INSTALL inside the package so it travels
# with the wheel. This maps the one to the other: built from ./skills, installed
# as kubed/selenium_flow/skills/. Without it the skill is simply absent from an
# installed package and silently does not exist.
# The web UI is mapped the same way and for the same reason: ./static is where
# a stylesheet and two HTML pages belong in a checkout, but they have to ship
# inside the package or the admin UI 500s on an installed copy.
[tool.setuptools.package-dir]
"kubed.selenium_flow.skills" = "skills"
"kubed.selenium_flow.static" = "static"

# Everything under it, not just *.md: a supporting file of any other type would
# otherwise be missing from the wheel with no error at build or import time, and
# the skill would reference a file that is not there.
#
# The directory name IS the skill name — FastMCP's SkillProvider takes it from
# the folder, not the frontmatter, and publishes skill://<folder>/SKILL.md.
[tool.setuptools.package-data]
"kubed.selenium_flow.skills" = ["*", "**/*"]
"kubed.selenium_flow.static" = ["*"]

[tool.pytest.ini_options]
minversion = "6.0"
asyncio_mode = "auto"
addopts = "--verbose"
testpaths = ["tests"]
markers = [
  "unit: mark a test as a unit test",
  "integration: mark a test as an integration test",
]

[tool.ruff]
# The oldest interpreter supported, so ruff flags a construct that would break
# there rather than one that merely looks dated on the newest.
target-version = "py310"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "UP",       # constructs a newer supported Python does better
  "B",        # bugbear: the mistakes that survive review
  "SIM",      # simplifications
  "C4",       # comprehensions
  "PIE",      # small dead weight
  "PTH",      # pathlib over os.path, which CONTRIBUTING already asks for
  "RET",      # return-flow noise
  "RUF",      # ruff's own, incl. RUF100 for noqas that stopped applying
  "BLE",      # blind except
]

# TRY is deliberately absent. Its headline rule, TRY003, wants a long exception
# message moved into a custom exception class per message — and here an error
# message IS the interface: it tells the caller which session mode they are in,
# what to call instead, and which skill reference explains it. Scattering that
# guidance away from the check that raises it would cost the thing that makes
# these errors useful.

# BLE001 is ON, and every blind except in this package already carries a
# `# noqa: BLE001` with the reason it is deliberate — a status resource that
# must never fail, a probe that must never raise, a browser that is being
# discarded anyway. Keeping the rule enabled is what makes those comments mean
# something: RUF100 now fails a noqa that has stopped applying, so they cannot
# rot into decoration, and a NEW blind except has to argue for itself.

[tool.ruff.lint.per-file-ignores]
# Long, specific assertion messages are the point of a test; wrapping them to 88
# columns makes them harder to read, not easier.
"tests/*" = ["E501"]
# Both generators are executable scripts: they fix up sys.path so a checkout
# runs without an install, which has to happen before the package imports.
"scripts/generate_wiki.py" = ["E402"]
