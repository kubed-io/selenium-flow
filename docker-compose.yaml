# Local build + smoke test for the kubed/selenium-flow image. `docker buildx bake`
# reads the build block below -- that is what CI runs, so the tag list and
# x-bake settings here are the release configuration, not just local convenience.
services:
  selenium-flow:
    image: kubed/selenium-flow:latest
    build:
      context: .
      target: runner
      args:
        PY_VERSION: ${PY_VERSION:-3.14}
      # No literal tag: image.yml's "Resolve image tag" step sets IMAGE_LATEST,
      # IMAGE_REF and IMAGE_TAG, and the build-image action sets GIT_SHA. A
      # branch build sets the first three to its branch, so it never moves
      # :latest. Unset, as in a local bake, every one is :latest.
      tags:
      - kubed/selenium-flow:${IMAGE_LATEST:-latest}
      - kubed/selenium-flow:${IMAGE_REF:-latest}
      - kubed/selenium-flow:${IMAGE_TAG:-latest}
      - kubed/selenium-flow:${GIT_SHA:-latest}
      x-bake:
        platforms:
        - linux/amd64
        - linux/arm64
        cache-to: type=gha,mode=max,scope=selenium-flow
        cache-from: type=gha,scope=selenium-flow
    container_name: selenium-flow
    restart: no
    ports:
    - 8000:8000
    environment:
      TRANSPORT: ${TRANSPORT:-http}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      # Points at the companion Grid below. In the cluster this is the Grid
      # Service; there is no default that is right in both places.
      GRID_URL: ${GRID_URL:-http://selenium:4444}
      # Empty disables auth, which is what you want locally.
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      REDIS_URL: ${REDIS_URL:-}
      # Opt in to saved flows, kept files and recordings: off by default, since
      # Docker creates a missing bind-mount folder as root and this image runs
      # as 65534, which then cannot write it. First, once:
      #   mkdir -p data/recordings && chmod -R 777 data
      # then uncomment these two settings, the volume below, and the Grid's
      # recording lines. The README's "Recording" section has the details.
      # DATA_DIR: /data
      # RECORDING_ENABLED: "true"
    # volumes:
    # - ./data:/data
    depends_on:
      selenium:
        condition: service_healthy

  # A standalone Grid so `docker compose up` is a working system, not just a
  # process that fails its first call.
  selenium:
    image: selenium/standalone-chromium:latest
    container_name: selenium-flow-grid
    restart: no
    shm_size: 2gb
    ports:
    - 4444:4444
    - 7900:7900
    environment:
      SE_NODE_SESSION_TIMEOUT: ${SE_NODE_SESSION_TIMEOUT:-300}
      # Recording, opt-in with DATA_DIR above. The recorder is built into the
      # standalone image. Event-driven mode listens on a Grid event bus that a
      # standalone container may not expose, so polling mode is used instead
      # (SE_VIDEO_EVENT_DRIVEN=false with SE_VIDEO_RECORD_STANDALONE=true).
      # Not yet verified end to end.
      # SE_VIDEO_EVENT_DRIVEN: "false"
      # SE_VIDEO_RECORD_STANDALONE: "true"
    # volumes:
    # - ./data/recordings:/videos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 20
