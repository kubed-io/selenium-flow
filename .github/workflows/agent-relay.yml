name: Agent Relay

# A pull request review, or a push to a pull request, runs the PR's own copy of a
# workflow, so nothing privileged listens to it directly. This one does nothing; its
# completion fires agent-pr.yml's workflow_run, which is read from main and decides.

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]

permissions: {}

jobs:
  relay:
    name: Relay the Review
    runs-on: ubuntu-26.04
    steps:

    - name: Relay
      env:
        EVENT: ${{ github.event_name }}
        ACTOR: ${{ github.triggering_actor }}
        NUMBER: ${{ github.event.pull_request.number }}
      run: echo "$EVENT by $ACTOR on PR $NUMBER"
