name: 🧭 Agent · Issue

# The issue is where the spec is made. On an `enhancement` issue, Dr K's `agent` label opts
# it in, and every comment from Dr K is the next turn: the agent researches, brainstorms,
# and keeps its notes at the bottom of the issue. With the `spec` label it also gets the
# branch issue-<N>, writes its draft spec there (docs/, the wiki) and it is committed every
# turn. `spec approved` opens the draft PR from that branch, or from a new one with an
# empty commit, and starts the plan on it.
#
# The job gates name ids, not variables: a job's `if` is decided before any runner, so
# only GitHub's own event data can vouch for the sender. 4399427 is Dr K. Who else
# counts inside a run comes from the claude runner's env.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

jobs:

  spec:
    name: Spec
    if: >-
      github.event.sender.id == 4399427 &&
      github.triggering_actor == 'kferrone' &&
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'enhancement') &&
      contains(github.event.issue.labels.*.name, 'agent') &&
      !contains(github.event.issue.labels.*.name, 'spec approved') &&
      (github.event_name == 'issue_comment' || github.event.label.name == 'agent' || github.event.label.name == 'spec')
    runs-on: claude
    environment: claude
    # Dr K's comments wait their turn; a label takes the issue over
    concurrency:
      group: agent-issue-${{ github.event.issue.number }}
      cancel-in-progress: ${{ github.event_name == 'issues' }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      # the `spec` label gives the agent a branch, and files that are committed
      WRITES: ${{ contains(github.event.issue.labels.*.name, 'spec') }}
      BRANCH: issue-${{ github.event.issue.number }}
    steps:

    - name: App Token
      id: app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-contents: write
        permission-issues: write
        repositories: |
          selenium-flow
          .github-private

    - name: Branch
      if: env.WRITES == 'true'
      uses: kubed-io/actions/git/branch@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BRANCH }}
        issue: ${{ github.event.issue.number }}

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ env.WRITES == 'true' && env.BRANCH || '' }}
        submodules: true
        persist-credentials: false

    # the org's agents; after the repo's checkout, which would clean them away
    - name: Checkout the Agents
      uses: actions/checkout@v7
      with:
        repository: kubed-io/.github-private
        token: ${{ steps.app.outputs.token }}
        path: .issue/roles
        sparse-checkout: claude
        persist-credentials: false

    - name: Spec Agent
      id: agent
      uses: kubed-io/actions/issue-agent@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        agent: .issue/roles/claude/agents/spec.md
        schema: .issue/roles/claude/agents/spec.schema.json
        opt_in_label: agent
        # the `spec` label's turn is a kb prompt (superpowers library)
        prompt: ${{ github.event_name == 'issues' && github.event.label.name == 'spec' && '/mcp__superpowers__superpowers_spec-draft' || '' }}
        session_key: issue-${{ github.event.issue.number }}
        mcp_config: ${{ env.CLAUDE_MCP_PROFILES }}/docs.json
        allowed_tools: ${{ env.WRITES == 'true' && 'Read,Glob,Grep,Write,Edit' || 'Read,Glob,Grep' }}
        disallowed_tools: ${{ env.WRITES == 'true' && 'Bash,NotebookEdit' || 'Bash,Edit,Write,MultiEdit,NotebookEdit' }}
        claude_args: --strict-mcp-config

    # the draft spec lives under docs/: the wiki first, with git; then its pointer in one signed commit
    - name: Push the Wiki
      if: env.WRITES == 'true' && fromJSON(steps.agent.outputs.output || '{}').commit_message
      uses: kubed-io/actions/git/submodule@main
      with:
        message: ${{ fromJSON(steps.agent.outputs.output).commit_message }}
        token: ${{ steps.app.outputs.token }}
        app_slug: ${{ steps.app.outputs.app-slug }}

    - name: Commit the Spec
      if: env.WRITES == 'true' && fromJSON(steps.agent.outputs.output || '{}').commit_message
      uses: kubed-io/actions/git/commit@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BRANCH }}
        message: ${{ fromJSON(steps.agent.outputs.output).commit_message }}
        files: docs

  handoff:
    name: Hand Off
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'spec approved' &&
      github.event.sender.id == 4399427 &&
      github.triggering_actor == 'kferrone' &&
      contains(github.event.issue.labels.*.name, 'agent')
    runs-on: claude
    environment: claude
    # the approval takes the issue over from a spec turn still running
    concurrency:
      group: agent-issue-${{ github.event.issue.number }}
      cancel-in-progress: true
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BRANCH: issue-${{ github.event.issue.number }}
      DEFAULT: ${{ github.event.repository.default_branch }}
    outputs:
      pull_request: ${{ steps.pr.outputs.number }}
      branch: ${{ env.BRANCH }}
    steps:

    - name: App Token
      id: app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: write

    # found when the `spec` label made it; made, linked to the issue, when not
    - name: Branch
      uses: kubed-io/actions/git/branch@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BRANCH }}
        issue: ${{ github.event.issue.number }}

    # the plan starts from the default branch as it is today. A spec branch holds only wiki
    # pointer commits, so it starts over there and the commit below points docs at the wiki,
    # which has the spec; merging would conflict on that pointer. Anything else on the branch
    # gets the default branch merged in.
    - name: Fresh from the Default Branch
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
      run: |
        compare="repos/${GITHUB_REPOSITORY}/compare/${DEFAULT}...${BRANCH}"
        [ "$(gh api "$compare" --jq .behind_by)" = 0 ] && exit 0
        if [ "$(gh api "$compare" --jq '[.files[].filename] | unique | join(",")')" = docs ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
            -f sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT}" --jq .sha)" -F force=true --silent
        elif ! gh api "repos/${GITHUB_REPOSITORY}/merges" -f base="$BRANCH" -f head="$DEFAULT" \
            -f commit_message="Merge ${DEFAULT} into ${BRANCH}" --silent; then
          echo "::warning::${DEFAULT} could not be merged into ${BRANCH}; the plan starts from the branch as it is"
        fi

    # GitHub opens no PR on a branch with nothing beyond its base
    - name: Ahead of the Default Branch
      id: ahead
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
      run: echo "by=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${DEFAULT}...${BRANCH}" --jq .ahead_by)" >> "$GITHUB_OUTPUT"

    - name: Checkout
      if: steps.ahead.outputs.by == '0'
      uses: actions/checkout@v7
      with:
        ref: ${{ env.BRANCH }}
        submodules: true
        persist-credentials: false

    # the wiki's head has every spec pushed so far, this issue's among them
    - name: Point at the Wiki
      if: steps.ahead.outputs.by == '0'
      run: git submodule update --remote docs

    - name: Start Commit
      if: steps.ahead.outputs.by == '0'
      uses: kubed-io/actions/git/commit@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BRANCH }}
        message: "Start #${{ github.event.issue.number }}"
        files: docs
        allow_empty: true

    - name: Pull Request
      id: pr
      uses: kubed-io/actions/git/pr@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BRANCH }}
        title: ${{ github.event.issue.title }}
        body: |
          Closes #${{ github.event.issue.number }}

          Starts from #${{ github.event.issue.number }}'s notes.

  plan:
    name: Plan
    needs: handoff
    if: needs.handoff.outputs.pull_request != ''
    runs-on: claude
    environment: claude
    # the PR's group, shared with agent-pr.yml
    concurrency:
      group: agent-pr-${{ needs.handoff.outputs.pull_request }}
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: read
    steps:

    - name: App Token
      id: app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: write
        repositories: |
          selenium-flow
          .github-private

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.handoff.outputs.branch }}
        submodules: true
        persist-credentials: false

    # the org's agents; after the repo's checkout, which would clean them away
    - name: Checkout the Agents
      uses: actions/checkout@v7
      with:
        repository: kubed-io/.github-private
        token: ${{ steps.app.outputs.token }}
        path: .issue/roles
        sparse-checkout: claude
        persist-credentials: false

    - name: Plan Agent
      id: agent
      uses: kubed-io/actions/issue-agent@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.handoff.outputs.pull_request }}
        agent: .issue/roles/claude/agents/plan.md
        schema: .issue/roles/claude/agents/plan.schema.json
        prompt: /mcp__superpowers__superpowers_spec-approved
        header: "📄 Plan · [{{ output.plan_path }}]({{ blob }}/{{ output.plan_path }})"
        session_key: pr-${{ needs.handoff.outputs.pull_request }}
        mcp_config: ${{ env.CLAUDE_MCP_PROFILES }}/docs.json
        allowed_tools: Read,Glob,Grep,Write,Edit
        disallowed_tools: Bash,NotebookEdit
        claude_args: --strict-mcp-config

    # the plan and spec live under docs/: the wiki first, with git; then its pointer in one signed commit
    - name: Push the Wiki
      if: fromJSON(steps.agent.outputs.output || '{}').commit_message
      uses: kubed-io/actions/git/submodule@main
      with:
        message: ${{ fromJSON(steps.agent.outputs.output).commit_message }}
        token: ${{ steps.app.outputs.token }}
        app_slug: ${{ steps.app.outputs.app-slug }}

    - name: Commit the Plan
      if: fromJSON(steps.agent.outputs.output || '{}').commit_message
      uses: kubed-io/actions/git/commit@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ needs.handoff.outputs.branch }}
        message: ${{ fromJSON(steps.agent.outputs.output).commit_message }}
        files: docs
