name: 🧪 Test

# Unit tests only. They wire a server against an unroutable Grid address and
# exercise coercion, auth and both surfaces through the real ASGI app — no
# browser, no network, so this stays fast and needs no Grid in CI.
#
# The matrix is event-shaped, and that is the whole design of this file:
#
#   pull_request     3.11 and 3.14 — the floor and the newest, in parallel
#   push: main       3.11 → 3.14 — the compatibility sweep, run once the change
#                    has already landed, for the versions in between
#   workflow_call    full matrix too (the caller's event is not pull_request) —
#                    publish.yml runs this before it cuts a version, so a release
#                    never ships an interpreter it has not been tested on
#
# A pull request used to run 3.14 alone, leaving old interpreters to the sweep
# on main. That sweep stayed red on the floor from #59 to #70 and nobody
# looked: tests patching `os.stat` that pathlib there never called. The floor is
# where pathlib and friends differ most, so it catches most of what 3.11-3.13 would.
# `Test results` is the required check, and it fails when any leg fails: 3.11 gates a
# pull request as much as 3.14 does.
#
# pyproject declares requires-python >=3.11, the floor. Testing only the newest
# interpreter would leave three of those four claims unverified, and a release is exactly the
# moment that matters.

on:
  # pull requests: pr.yml calls this, with every other check, so one collector sees them all
  # (with no path filter: a required check that never reports blocks a PR forever)
  push:
    branches: [main]
    paths:
    - kubed/**
    - tests/**
    - scripts/**
    - pyproject.toml
    - .github/workflows/test.yml
  workflow_dispatch:
  workflow_call: {}

permissions:
  contents: read

jobs:

  test:
    name: Test
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    # the suite takes minutes; a hang fails here, red, instead of holding the PR for 6 hours
    timeout-minutes: 20
    permissions:
      contents: read
      # The results and coverage comments on the pull request, and the check
      # run with a failing test's annotations. Only the 3.14 leg posts them.
      checks: write
      pull-requests: write
    strategy:
      # One interpreter failing should not hide the others — on a main-branch
      # sweep the useful answer is "which versions broke", not "the first one to".
      fail-fast: false
      matrix:
        # A pull request pays for the floor and the newest; everything else
        # sweeps the supported range. The required status check is `Test results`
        # below, which every leg feeds: a skipped matrix reports only as `Test`,
        # never under a leg's name, so no leg can be the required one.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11", "3.14"]') || fromJSON('["3.11", "3.12", "3.13", "3.14"]') }}
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        # setuptools_scm needs history to resolve a version at install time.
        fetch-depth: 0
        # The wiki submodule, so tests/test_wiki.py actually runs instead of
        # skipping. It is where wiki staleness is caught: wiki.yml publishes but
        # does not judge, so without this a pull request that forgot to
        # regenerate would pass everything and ship a wiki describing the old
        # surface.
        submodules: true
        # Nothing here pushes, and a checkout that leaves the token in
        # .git/config leaves it readable by every later step and any artifact
        # that sweeps up the workspace.
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    # The page scripts run under jsdom (tests/test_js_behaviour.py), which lives
    # in ui/node_modules. Without these two steps that module skips itself.
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Install UI Dependencies
      run: npm --prefix ui ci --no-audit --no-fund

    - name: Install
      run: pip install .[test]

    # No paths: the ruff config covers the whole checkout now, tests included,
    # so naming directories here is a second list to keep in sync with it.
    - name: Lint
      run: ruff check .

    # --junit-xml is what makes the results readable without opening the log:
    # the next step renders it into the run summary, and a failing assertion
    # shows up as a named test rather than a wall of pytest output.
    - name: Test
      run: >-
        pytest
        -n 2
        --dist loadfile
        --junit-xml=dist/test-results.xml
        --cov=kubed.selenium_flow
        --cov-report=xml:dist/coverage.xml

    # Runs even when pytest fails — that is the case where the report is worth
    # the most. fail-on-empty catches the other failure mode, a run that
    # collected nothing and exited green.
    - name: Surface Failing Tests
      if: always()
      uses: pmeier/pytest-results-action@v0.9.0
      with:
        path: dist/test-results.xml
        summary: true
        display-options: fEX
        fail-on-empty: true

    # Keep the raw JUnit XML downloadable from the run, one artifact per leg so
    # a matrix sweep does not have five uploads racing for the same name.
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.python-version }}
        path: dist/test-results.xml
        if-no-files-found: error

    # Coverage of the files the pull request touches, as a comment. No
    # thresholds: it informs a review, it does not gate one.
    - name: Coverage Report
      if: always() && github.event_name == 'pull_request' && matrix.python-version == '3.14'
      uses: orgoro/coverage@v3.3.1
      with:
        coverageFile: dist/coverage.xml
        token: ${{ github.token }}

  # Every leg's results as one: the sticky comment, the check run that annotates a
  # failing test where it fails, and the required status check. It runs whatever the
  # legs did, so a failing leg still publishes, then fails here; on a draft it is
  # skipped, which a required check counts as passed.
  results:
    name: Test results
    needs: test
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:

    # No merge-multiple: every leg's file is named test-results.xml, so merged they
    # would overwrite each other; each artifact lands in its own directory instead.
    - name: Download Every Leg's Results
      uses: actions/download-artifact@v8
      with:
        path: results
        pattern: test-results-*

    - name: One Report per Leg
      env:
        LEGS: ${{ github.event_name == 'pull_request' && 2 || 4 }}
      run: |
        found=$(find results -name '*.xml' | wc -l)
        echo "$found reports for $LEGS legs"
        [ "$found" -eq "$LEGS" ] || { echo "::error::$LEGS legs, $found reports"; exit 1; }

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2.25.0
      with:
        check_name: Unit test results
        files: results/**/*.xml
        comment_mode: always

    - name: Every Leg Passed
      if: needs.test.result != 'success'
      env:
        RESULT: ${{ needs.test.result }}
      run: |
        echo "::error::the test matrix ended $RESULT"
        exit 1
