name: 🧬 Publish Version

# Manual, intentional release — three jobs so the image is on Docker Hub BEFORE
# the GitHub Release is cut:
#
#   version → roll CHANGELOG [Unreleased], commit + tag on main
#   image   → check out that tag and build+push kubed/selenium-flow:<tag>
#   release → create the GitHub Release for the tag
#
# Unlike the private sibling repos, nothing here pins a deployed tag: this repo
# ships an image and nothing else. The tag that actually runs lives in the
# cluster repo at apps/selenium/components/mcp/kustomization.yaml.
#
# Run once with push=false (dry run — computes the next version and builds the
# image without pushing, changes nothing) then push=true to release.
#
# This is a public repo: credentials are org secrets, with no GCP hop. The
# kubed.io App token is what lets version-bump commit to protected main and
# create the tag.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Version to bump to
        default: patch
        type: choice
        options:
        - patch
        - minor
        - major
        - premajor
        - preminor
        - prepatch
      push:
        description: Push changes and create release
        default: false
        type: boolean

permissions:
  # contents: write so version-bump can commit the rolled CHANGELOG and create
  # the tag on main.
  contents: write

jobs:

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
      release-notes: ${{ steps.bump.outputs.release-notes }}
    steps:

    - name: Validate Branch
      if: inputs.push
      env:
        REF: ${{ github.ref_name }}
      run: |
        if [[ "$REF" != "main" ]]; then
          echo "::error::Releases can only be pushed from main. Current ref: $REF"
          exit 1
        fi

    - name: Create GitHub App Token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ vars.GH_APP_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}

    - name: Bump Version
      id: bump
      uses: duplocloud/version-bump@main
      with:
        version: ${{ inputs.action }}
        push: ${{ inputs.push }}
        token: ${{ steps.app-token.outputs.token }}

  # Build + push the image at the freshly tagged commit. On a dry run there is no
  # tag, so it builds the current ref without pushing (proves it still builds).
  image:
    name: Publish Image
    needs: version
    uses: ./.github/workflows/image.yml
    secrets: inherit
    with:
      tag: ${{ inputs.push && needs.version.outputs.tag || '' }}
      push: ${{ inputs.push }}

  release:
    name: Release
    needs:
    - version
    - image
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release on the existing tag
    steps:

    - name: Create Release
      uses: softprops/action-gh-release@v3.0.3
      with:
        name: ${{ needs.version.outputs.tag }}
        tag_name: ${{ needs.version.outputs.tag }}
        prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
        body: |
          [![Image Builder](${{ github.server_url }}/${{ github.repository }}/actions/workflows/image.yml/badge.svg)](${{ github.server_url }}/${{ github.repository }}/actions/workflows/image.yml)

          Image: `kubed/selenium-flow:${{ needs.version.outputs.tag }}`

          ${{ needs.version.outputs.release-notes }}

    - name: Summary
      env:
        TAG: ${{ needs.version.outputs.tag }}
        RELEASE_NOTES: ${{ needs.version.outputs.release-notes }}
      run: |
        {
          echo "## Publish"
          echo ""
          echo "- **Tag**: $TAG"
          echo "- **Image**: kubed/selenium-flow:$TAG"
          echo ""
          echo "### Release Notes"
          echo ""
          echo "$RELEASE_NOTES"
        } >> "$GITHUB_STEP_SUMMARY"
