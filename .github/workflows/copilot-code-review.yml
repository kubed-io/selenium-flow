name: Copilot Code Review

# The environment Copilot's CODE REVIEWER runs in, which is a different job from
# the coding agent's.
#
# Without this file, code review falls back to `copilot-setup-steps.yml` — and
# that one provisions an environment for an agent that is going to EDIT this
# package: full history for setuptools_scm, the wiki submodule so test_wiki.py
# runs, and an editable install with [test,build]. A reviewer needs none of it.
# It reads a diff.
#
# So this is deliberately the smallest thing that can run: a shallow checkout,
# no submodules, no install. Less to go wrong, and nothing here can fail for a
# reason that has nothing to do with reviewing.
#
# The job MUST still be named `copilot-setup-steps` — that exact name is how
# GitHub finds it, in this file as well as in the other one.

on:
  workflow_dispatch:
  # Same shape as copilot-setup-steps.yml: the triggers exist only so a change
  # to this file is validated like any other workflow, and `branches` on the
  # push stops a pull request reporting two identical runs for one commit.
  push:
    branches: [main]
    paths:
    - .github/workflows/copilot-code-review.yml
  pull_request:
    # a draft runs nothing; marking it ready starts the checks
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
    - .github/workflows/copilot-code-review.yml

permissions:
  contents: read

jobs:

  copilot-setup-steps:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # The job ID is fixed by GitHub; the display name is not, and every other
    # job in this repository has one. It is also what the check run is called,
    # which matters here: both Copilot workflows have to use the same job ID,
    # so without a display name they would both report a check called
    # `copilot-setup-steps`.
    name: Copilot Review Setup
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # n8n relays this: Agent flow · intake (spec §8.4)
      # contents: write
      # # the hand-back: an agent-code dispatch (contents write) about this run (actions read)
      # actions: read
    steps:

    # n8n relays this: Agent flow · intake (spec §8.4)
    # # Copilot reviews only when Dr K asks it. Its review lands after this job ends, and
    # # nothing it triggers directly runs (GitHub holds them), so this step's post sends
    # # agent-code with reason `copilot` as the job ends; agent-pr.yml waits for the review
    # # and the code agent answers it, as it answers the review agent's
    # - name: Hand Back
    #   uses: kubed-io/actions/hand-back@main
    #   with:
    #     event_type: agent-code
    #     reason: copilot

    # Shallow, and no submodules. The reviewer wants the files as they are, not
    # a buildable checkout — and the wiki submodule is a second repository whose
    # only reader is a test this job does not run.
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
