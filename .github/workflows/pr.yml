name: 🔀 PR

# Every check a pull request gets, in one run: PR Tasks here, the rest called from their
# own workflows, and the `Checks` collector after them all. The collector gathers what
# failed (steps, annotations, the end of the logs) into the `checks-report` artifact;
# agent-review.yml, from main, reads it when this run ends and hands a failure to the code
# agent or the PR to the review agent. wiki.yml stays on its own trigger.
#
# PR Tasks: every PR must contribute a CHANGELOG entry, because that [Unreleased] section
# becomes the release notes at publish time. A PR with no new entry fails here.
#
# There are two escape hatches, and they cover different things:
#
#   the `no changelog` label   a judgement call by a human, for work a user
#                              would not read about in release notes
#   the Dependabot guard below unconditional, because a bump is never that work
#
# Dependabot also *applies* the label via .github/dependabot.yml, so the guard
# looks redundant. It is not. Dependabot can only apply a label that already
# EXISTS in the repository and drops any that does not, silently and with no
# warning anywhere — which is exactly what happened here: none of the five
# labels existed, every Dependabot PR arrived unlabelled, and this gate failed
# on all of them. The labels are created now, but a label is repository state
# that anyone can rename or delete, while this guard is in the workflow with
# the rule it protects.

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled so applying the `no changelog` label (e.g. Dependabot,
    # or a late add) re-runs the gate with a fresh payload. A draft runs
    # nothing; ready_for_review starts the checks.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

# a push cancels the checks it outdates; a label run is apart, so it never cancels them
concurrency:
  group: pr-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && 'labels' || 'checks' }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-tasks:
    name: PR Tasks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Auto-assign needs to write the assignee on the PR.
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # Nothing here pushes; the two actions below talk to the API with the
        # job's token, not with a git remote.
        persist-credentials: false

    # Assign the PR author to their own PR per .github/assign.yml.
    - name: Auto Assign
      uses: kentaro-m/auto-assign-action@v2.0.2
      with:
        configuration-path: .github/assign.yml

    # `pull_request.user.login`, not `github.actor`: on a `labeled` event the
    # actor is whoever applied the label, so a human touching a Dependabot PR
    # would put the gate back. The author is what actually identifies the PR.
    - name: Make sure Changelog is updated
      if: github.event.pull_request.user.login != 'dependabot[bot]'
      uses: tarides/changelog-check-action@v4
      with:
        changelog: CHANGELOG.md

  # The checks. A label event runs PR Tasks alone: these skip at the caller, which
  # reports the caller's name only, so a skip never stands in for a required check.
  test:
    name: Test
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    uses: ./.github/workflows/test.yml
    secrets: inherit
    permissions:
      contents: read
      checks: write
      pull-requests: write

  quality:
    name: Quality
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    uses: ./.github/workflows/quality.yml
    secrets: inherit
    permissions:
      contents: read
      security-events: write

  ui:
    name: UI
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    uses: ./.github/workflows/ui.yml
    secrets: inherit
    permissions:
      contents: read

  integration:
    name: Integration
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    uses: ./.github/workflows/integration.yml
    secrets: inherit
    permissions:
      contents: read
      checks: write
      pull-requests: write

  bench:
    name: Bench
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    uses: ./.github/workflows/bench.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write

  package:
    name: Package
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    uses: ./.github/workflows/package.yml
    secrets: inherit
    permissions:
      contents: read

  # What failed, for whoever fixes it: never an agent here, since this run is the PR's own
  # copy of the workflow. It always succeeds; the checks themselves are what gate.
  checks:
    name: Checks
    needs: [pr-tasks, test, quality, ui, integration, bench, package]
    if: >-
      always() && !github.event.pull_request.draft &&
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      checks: read
    steps:

    - name: Collect
      uses: actions/github-script@v9
      env:
        DIR: ${{ runner.temp }}/checks-report
        SHA: ${{ github.event.pull_request.head.sha }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const { DIR, SHA } = process.env;
          const bad = ['failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure'];
          const jobs = (await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
            ...context.repo, run_id: context.runId, filter: 'latest', per_page: 100,
          })).filter((j) => j.name !== context.job && j.status === 'completed');
          const failed = jobs.filter((j) => bad.includes(j.conclusion));

          const log = async (job) => {
            try {
              const { data } = await github.rest.actions.downloadJobLogsForWorkflowRun({ ...context.repo, job_id: job.id });
              const text = typeof data === 'string' ? data : Buffer.from(data).toString('utf8');
              // no timestamps, no colour codes: the report is read, not displayed
              const lines = text.split(/\r?\n/).map((l) => l.replace(/^\d{4}-\d\d-\d\dT[\d:.]+Z ?/, '').replace(/\x1b\[[0-9;]*[A-Za-z]/g, ''));
              const errors = lines.filter((l) => l.includes('##[error]'));
              // the lines that led to the last error, before the post-job cleanup
              let end = lines.findIndex((l) => l.startsWith('Post job cleanup.'));
              if (end < 0) end = lines.length;
              const last = lines.slice(0, end).findLastIndex((l) => l.includes('##[error]'));
              const stop = last >= 0 ? last + 1 : end;
              return { errors: errors.slice(0, 40), tail: lines.slice(Math.max(0, stop - 150), stop) };
            } catch (err) {
              return { errors: [`(log unavailable: ${err.message})`], tail: [] };
            }
          };
          const notes = async (job) => {
            try {
              const all = await github.paginate(github.rest.checks.listAnnotations, { ...context.repo, check_run_id: job.id, per_page: 100 });
              return all.filter((a) => a.annotation_level !== 'notice').slice(0, 50);
            } catch { return []; }
          };

          const report = { sha: SHA, run: context.runId, passed: jobs.length - failed.length, failed: [] };
          const md = [`# Checks on ${SHA.slice(0, 7)}: ${failed.length ? `${failed.length} failed` : 'all passed'}`, ''];
          for (const job of failed) {
            const [l, a] = await Promise.all([log(job), notes(job)]);
            const steps = (job.steps || []).filter((s) => bad.includes(s.conclusion)).map((s) => s.name);
            report.failed.push({ name: job.name, conclusion: job.conclusion, url: job.html_url, steps, annotations: a.length });
            md.push(`## ${job.name}: ${job.conclusion}`, '', job.html_url, '');
            if (steps.length) md.push(`Failed steps: ${steps.join(', ')}`, '');
            if (a.length) {
              md.push('### Annotations', '');
              for (const n of a) md.push(`- ${n.annotation_level} \`${n.path}:${n.start_line}\`${n.title ? ` ${n.title}` : ''}: ${n.message.replace(/\s+/g, ' ').slice(0, 500)}`);
              md.push('');
            }
            if (l.errors.length) md.push('### Errors', '', '```', ...l.errors, '```', '');
            if (l.tail.length) md.push('### The log, up to the error', '', '```', ...l.tail, '```', '');
          }
          if (!failed.length) md.push(`Every check passed (${jobs.length} jobs).`);
          fs.mkdirSync(DIR, { recursive: true });
          fs.writeFileSync(path.join(DIR, 'report.md'), md.join('\n') + '\n');
          fs.writeFileSync(path.join(DIR, 'report.json'), JSON.stringify(report, null, 2) + '\n');
          await core.summary.addRaw(md.join('\n').slice(0, 900000)).write();

    - name: Upload the Report
      uses: actions/upload-artifact@v7
      with:
        name: checks-report
        path: ${{ runner.temp }}/checks-report
        retention-days: 14
