name: 🔍 Agent · Review

# The review agent, and the `Agent review` check it answers to. It wakes when pr.yml's
# checks end (workflow_run), and when an `agent-review` dispatch asks again. For a PR the
# agents built (head `issue-*`, plan approved), out of draft:
#
# - checks red: no review. The status fails as `checks failed`, and `agent-code` goes out
#   with `reason: ci` and the run, whose `checks-report` artifact the code agent reads.
# - checks green: one review: its summary, with line comments and suggestions under it,
#   on the built-in token, so it is github-actions[bot]'s and not the code agent's.
#   `changes requested` dispatches `agent-code` (`reason: review`); the code agent's fix
#   is a push, whose checks bring the next round; `looks good` passes the check.
#
# The check is a commit status on the PR's head, never this job's own check run: runs on
# workflow_run and repository_dispatch belong to main's commit, so they could not be the
# PR's required check. The status is also the loop's memory: a head the review agent
# already passed is never reviewed again, and every new commit starts without one;
# a commit that changes nothing of the PR's own (Update branch) keeps the last verdict.
# PRs the agents did not build get a passing status straight away, so the required check
# never blocks them.
#
# The gates name ids, not variables: a job's `if` is decided before any runner, so only
# GitHub's own event data can vouch for the sender. 4399427 is Dr K, 235398881 the
# kubed-io App's bot (the code agent), 41898282 github-actions[bot].

on:
  workflow_run:
    workflows: [🔀 PR]
    types: [completed]
  repository_dispatch:
    types: [agent-review]

permissions: {}

env:
  CHECK: Agent review
  # reviews, and commits whose checks failed, on one PR before it is handed to Dr K
  MAX_REVIEWS: 3
  MAX_FIXES: 3

jobs:

  route:
    name: Route
    # any PR's checks get a status; only Dr K, the App and the review agent itself ask for
    # a review by dispatch
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event.action == 'agent-review' &&
        (github.event.sender.id == 4399427 ||
          github.event.sender.id == 41898282 ||
          github.event.sender.id == 235398881))
    runs-on: ubuntu-26.04
    permissions:
      # contents write is the `agent-code` dispatch's
      contents: write
      actions: read
      pull-requests: read
      statuses: write
    outputs:
      number: ${{ steps.route.outputs.number }}
      sha: ${{ steps.route.outputs.sha }}
      last: ${{ steps.route.outputs.last }}
    steps:

    # reads the PR and the run, sets statuses, dispatches; nothing of the PR is checked out
    - name: Route
      id: route
      uses: actions/github-script@v9
      env:
        TRUSTED: 4399427,41898282,235398881
        AGENT: "41898282"
        OWNER: "4399427"
      with:
        script: |
          const e = context.payload;
          const dispatched = context.eventName === 'repository_dispatch';
          const run = e.workflow_run;
          for (const k of ['number', 'sha', 'last']) core.setOutput(k, '');
          if (run?.conclusion === 'cancelled') return core.info('cancelled: a newer push has its own run');
          let number = Number(dispatched ? e.client_payload?.pull_request : run?.pull_requests?.[0]?.number) || 0;
          // a fork's run names no PR: find it by its head
          if (!number && run) {
            const { data: prs } = await github.rest.pulls.list({ ...context.repo, state: 'open', head: `${run.head_repository?.owner?.login}:${run.head_branch}` });
            number = prs.find((p) => p.head.sha === run.head_sha)?.number || 0;
          }
          if (!number) return;
          const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
          if (pr.state !== 'open' || pr.draft) return;
          const sha = pr.head.sha;
          if (run && run.head_sha !== sha) return core.info(`${run.head_sha} is no longer the head`);
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const status = (state, description, target_url = runUrl) => github.rest.repos.createCommitStatus({
            ...context.repo, sha, state, description, target_url, context: process.env.CHECK,
          });

          const ours = pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
          const approved = pr.labels.some((l) => l.name === 'plan approved');
          if (!ours || !pr.head.ref.startsWith('issue-') || !approved) {
            await status('success', 'not built by the agents');
            return;
          }

          // the checks: a run without the collector's report ran none (a label, a draft)
          let checks = 'unknown';
          if (run) {
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: run.id, name: 'checks-report' });
            if (!data.artifacts.length) return core.info('no checks ran in this run');
            checks = run.conclusion === 'success' ? 'passed' : 'failed';
          }

          // the review agent's own statuses are the memory: one per commit it judged
          const mineOn = async (ref) => {
            const { data } = await github.rest.repos.listCommitStatusesForRef({ ...context.repo, ref, per_page: 100 });
            return data.find((s) => s.context === process.env.CHECK && String(s.creator?.id) === process.env.AGENT);
          };
          const failedChecks = (s) => /^checks failed/.test(s?.description || '');
          const mine = await mineOn(sha);
          if (mine?.state === 'success') return core.info(`${sha} already passed`);
          // a head is judged once; a dispatch asks again, and checks that turn green again
          // (a re-run) bring the review the red ones held back
          if (mine && !dispatched && !(failedChecks(mine) && checks === 'passed')) return core.info(`${sha} already ${mine.state}`);
          const actor = String((run ? run.triggering_actor : e.sender)?.id);
          if (!process.env.TRUSTED.split(',').includes(actor)) return core.info(`${actor} cannot start an agent`);

          // the earlier commits, newest first, with the review agent's status on each
          const commits = (await github.paginate(github.rest.pulls.listCommits, { ...context.repo, pull_number: number, per_page: 100 }))
            .map((c) => c.sha).filter((c) => c !== sha).reverse();
          const judged = [];
          for (const ref of commits) {
            const s = await mineOn(ref);
            if (s && (s.state === 'success' || s.state === 'failure')) judged.push({ ref, ...s });
          }
          const VERDICT = /^(looks good|changes requested|needs a human)$|^changes requested, last review/;

          // red: the code agent gets the run, the review waits for green
          if (checks === 'failed') {
            const fixes = judged.filter(failedChecks).length;
            const max = Number(process.env.MAX_FIXES);
            if (fixes >= max) {
              await status('failure', `needs a human: checks failed on ${fixes + 1} commits`, run.html_url);
              return;
            }
            await status('failure', `checks failed (fix ${fixes + 1} of ${max})`, run.html_url);
            await github.rest.repos.createDispatchEvent({
              ...context.repo, event_type: 'agent-code',
              client_payload: { pull_request: number, reason: 'ci', run_id: run.id },
            });
            return core.info(`checks failed: agent-code dispatched with run ${run.id}`);
          }

          // what the PR itself changes at a commit, blind to line numbers, so merging main
          // in leaves it as it was; null when GitHub's compare is cut off at 300 files
          const changes = async (ref) => {
            const { data } = await github.rest.repos.compareCommitsWithBasehead({ ...context.repo, basehead: `${pr.base.ref}...${ref}` });
            if ((data.files?.length || 0) >= 300) return null;
            return data.files.map((f) => `${f.status} ${f.filename} ${f.previous_filename || ''}\n${
              f.patch == null ? `blob ${f.sha}` : f.patch.replace(/^@@[^@]*@@/gm, '@@')}`).sort().join('\n');
          };
          // a commit that only brings main in (Update branch) keeps the last verdict
          const prior = judged.find((s) => VERDICT.test(s.description) || /^no changes since /.test(s.description));
          if (prior && !dispatched) {
            const [now, then] = await Promise.all([changes(sha), changes(prior.ref)]);
            if (now !== null && now === then) {
              const verdict = prior.description.replace(/^no changes since \w+: /, '');
              await status(prior.state, `no changes since ${prior.ref.slice(0, 7)}: ${verdict}`, prior.target_url);
              return core.info(`${sha} changes nothing of the PR's since ${prior.ref}`);
            }
          }

          // reviews so far: commits with a verdict of the review agent's own, not a carried one
          const done = judged.filter((s) => VERDICT.test(s.description)).length;
          const max = Number(process.env.MAX_REVIEWS);
          // Dr K's own dispatch is never capped
          const capped = !(dispatched && actor === process.env.OWNER);
          if (capped && done >= max) {
            await status('failure', `needs a human: ${done} reviews without a pass`);
            return;
          }
          await status('pending', `reviewing (${done + 1} of ${max})`);
          core.setOutput('number', String(number));
          core.setOutput('sha', sha);
          core.setOutput('last', String(capped && done + 1 >= max));

  review:
    name: Review
    needs: route
    if: needs.route.outputs.number != ''
    runs-on: claude
    environment: claude
    # one agent job per PR at a time, shared with agent-pr.yml
    concurrency:
      group: agent-pr-${{ needs.route.outputs.number }}
    timeout-minutes: 45
    permissions:
      # contents write is the dispatch's; the review, its comments, the notes and the
      # check are github-actions[bot]'s
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      # pr-checks: the alerts and the annotations
      checks: read
      security-events: read
    steps:

    # only to read the org's agents; the review itself goes on the built-in token
    - name: Agents Token
      id: roles
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        repositories: .github-private
        permission-contents: read

    - name: Checkout
      uses: actions/checkout@v7
      with:
        # the commit the check is for, even when the branch moves on meanwhile
        ref: ${{ needs.route.outputs.sha }}
        submodules: true
        persist-credentials: false

    # the org's agents; after the repo's checkout, which would clean them away
    - name: Checkout the Agents
      uses: actions/checkout@v7
      with:
        repository: kubed-io/.github-private
        token: ${{ steps.roles.outputs.token }}
        path: .issue/roles
        sparse-checkout: claude
        persist-credentials: false

    # what the checks found: the PR's code scanning alerts and the head's annotations
    - name: PR Checks
      uses: kubed-io/actions/pr-checks@main
      with:
        number: ${{ needs.route.outputs.number }}

    - name: Review Agent
      id: agent
      uses: kubed-io/actions/issue-agent@main
      with:
        github_token: ${{ github.token }}
        number: ${{ needs.route.outputs.number }}
        agent: .issue/roles/claude/agents/review.md
        schema: .issue/roles/claude/agents/review.schema.json
        # the turn's words are a kb prompt (superpowers library)
        prompt: /mcp__superpowers__superpowers_review
        prompt_when: always
        header: "**Verdict: {{ output.verdict }}**"
        review: "true"
        threads: "false"
        trusted: ${{ env.CLAUDE_OWNER_ID }},${{ env.CLAUDE_TRUSTED_BOTS }},kubed-io[bot]
        session_key: review-${{ needs.route.outputs.number }}
        mcp_config: ${{ env.CLAUDE_MCP_PROFILES }}/docs.json
        allowed_tools: Read,Glob,Grep
        disallowed_tools: Bash,Edit,Write,MultiEdit,NotebookEdit
        claude_args: --strict-mcp-config

    # the verdict is the check: only `looks good` passes it
    - name: Set the Check
      if: always()
      uses: actions/github-script@v9
      env:
        NUMBER: ${{ needs.route.outputs.number }}
        SHA: ${{ needs.route.outputs.sha }}
        LAST: ${{ needs.route.outputs.last }}
        OUTPUT: ${{ steps.agent.outputs.output }}
        REVIEW_ID: ${{ steps.agent.outputs.review_id }}
        COMMENT_ID: ${{ steps.agent.outputs.comment_id }}
      with:
        script: |
          const { NUMBER, SHA, LAST, OUTPUT, REVIEW_ID, COMMENT_ID } = process.env;
          let verdict = '';
          try { verdict = JSON.parse(OUTPUT || '{}').verdict || ''; } catch {}
          const pr = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${NUMBER}`;
          const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const target_url = REVIEW_ID ? `${pr}#pullrequestreview-${REVIEW_ID}`
            : COMMENT_ID ? `${pr}#issuecomment-${COMMENT_ID}` : run;
          const [state, description] =
            verdict === 'looks good' ? ['success', 'looks good']
            : verdict === 'changes requested' && LAST === 'true' ? ['failure', 'changes requested, last review: over to Dr K']
            : verdict ? ['failure', verdict]
            : ['error', 'the review did not finish'];
          await github.rest.repos.createCommitStatus({
            ...context.repo, sha: SHA, state, description, target_url, context: process.env.CHECK,
          });

    # a pointer, never the review: the code agent reads it from the PR
    - name: Wake the Code Agent
      if: >-
        needs.route.outputs.last != 'true' &&
        fromJSON(steps.agent.outputs.output || '{}').verdict == 'changes requested'
      env:
        GH_TOKEN: ${{ github.token }}
        NUMBER: ${{ needs.route.outputs.number }}
        REVIEW_ID: ${{ steps.agent.outputs.review_id }}
      run: |
        gh api "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=agent-code \
          -F "client_payload[pull_request]=${NUMBER}" -f "client_payload[reason]=review" \
          -f "client_payload[review_id]=${REVIEW_ID}"
