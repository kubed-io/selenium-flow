name: 📖 Wiki

# Publishes the wiki. The action pages are generated from openapi.yaml, which is
# itself generated from the live MCP tool schemas, so the wiki is downstream of
# the code and has to be republished when the code changes — otherwise it
# describes a server that no longer exists.
#
#   pull_request        generate only, never pushes — the "does it still build?" gate
#   push: main          generate and push to the wiki
#   workflow_dispatch   manual republish, e.g. after editing wiki-notes
#   workflow_call       called by publish.yml; the caller decides whether to push
#
# Staleness is NOT this workflow's job. tests/test_wiki.py fails when the
# committed pages do not match the generator, and test.yml runs it with the
# submodule checked out — so a pull request that forgot to regenerate fails the
# test suite, where a contributor is already looking.
#
# The wiki is its own git repository at <repo>.wiki.git, and a submodule here at
# wiki/ — hence the submodule checkout and the push from inside that directory
# rather than a commit to this repo.

on:
  pull_request:
    branches: [main]
    paths:
    - openapi.yaml
    - wiki-notes/**
    - wiki
    - scripts/generate_wiki.py
    - .github/workflows/wiki.yml
  push:
    branches: [main]
    paths:
    - openapi.yaml
    - wiki-notes/**
    - wiki
    - scripts/generate_wiki.py
    - .github/workflows/wiki.yml
  workflow_dispatch:
    inputs:
      push:
        description: Push to the wiki
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      push:
        description: Push to the wiki
        type: boolean
        required: false
        default: false
    secrets:
      # Both optional, and only consulted by a run that pushes. Without them the
      # built-in GITHUB_TOKEN does the push, which is enough: a wiki lives under
      # its repository's permissions, so `contents: write` covers it. Supply the
      # App to publish under its identity instead, or if a ruleset ever starts
      # refusing the Actions one.
      #
      # The id travels as a secret rather than being read from `vars` so a
      # caller can hand one in — though see the step below for why the *switch*
      # still reads the variable.
      app-id:
        required: false
      app-key:
        required: false

permissions:
  contents: write   # the wiki repo lives under this repository's permissions

# One publisher at a time. Two runs racing to push the same generated pages is a
# guaranteed non-fast-forward, and the loser fails for no useful reason.
# cancel-in-progress stays false so a queued run is not killed.
concurrency:
  group: wiki-${{ github.ref }}

jobs:

  wiki:
    name: Publish Wiki
    runs-on: ubuntu-latest
    env:
      # true only for a real publish: merge to main, or a dispatch/call with
      # push=true. A pull_request run never pushes.
      PUSH: ${{ (github.event_name == 'push' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.push)) && 'true' || 'false' }}
    steps:

    # Only a run that pushes needs a writable identity; a pull_request run just
    # generates and throws the result away.
    #
    # Gated on the *variable* because the `secrets` context cannot be used in an
    # `if`. That is fine here: the App is the optional path, so when there is no
    # GH_APP_ID this step is skipped and the built-in token pushes instead.
    # Passed-in secrets still win over the repo's own when both exist.
    - name: Create GitHub App Token
      id: app-token
      if: env.PUSH == 'true' && vars.GH_APP_ID != ''
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.app-id || vars.GH_APP_ID }}
        private-key: ${{ secrets.app-key || secrets.GH_APP_KEY }}

    - name: Checkout
      uses: actions/checkout@v7
      with:
        # The wiki submodule is the thing being published, so it has to be here.
        submodules: true
        # Also rewrites the submodule's https:// origin to carry this token, so
        # the checkout and the later push both authenticate with no extra work.
        token: ${{ steps.app-token.outputs.token || github.token }}
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install
      run: pip install pyyaml

    - name: Generate
      run: python scripts/generate_wiki.py

    - name: Diff
      id: diff
      working-directory: wiki
      run: |
        git add -A
        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "The wiki is already current." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        echo "changed=true" >> "$GITHUB_OUTPUT"
        {
          echo "## Wiki changes"
          echo ""
          echo '```'
          git diff --cached --stat
          echo '```'
          if [[ "$PUSH" != "true" ]]; then
            echo ""
            echo "_Not published — this run does not push._"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Push
      if: env.PUSH == 'true' && steps.diff.outputs.changed == 'true'
      working-directory: wiki
      env:
        SHA: ${{ github.sha }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Regenerate from ${SHA:0:8}"
        # The wiki's default branch is master, not main — GitHub creates it that
        # way and does not follow the repository's own default.
        git push origin HEAD:master

    # The submodule now points at a commit that exists only on the wiki remote.
    # Left unrecorded, a fresh clone of this repo checks out the previous wiki
    # revision, which is a confusing thing to debug months later.
    - name: Record the Submodule Pointer
      if: env.PUSH == 'true' && steps.diff.outputs.changed == 'true'
      run: |
        if git diff --quiet -- wiki; then
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add wiki
        git commit -m "chore: bump wiki submodule [skip ci]"
        git push origin "HEAD:${GITHUB_REF_NAME}" || {
          echo "::warning::Wiki published, but the submodule pointer could not be \
          recorded — main is probably protected against the Actions identity. \
          Pass app-id and app-key, or bump wiki/ by hand."
        }
