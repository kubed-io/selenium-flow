name: 📖 Wiki

# Publishes the wiki. The action pages are generated from the OpenAPI spec, which
# the generator builds in-process from the live MCP tool schemas, so the wiki is
# downstream of the code and has to be republished when the code changes —
# otherwise it describes a server that no longer exists.
#
#   pull_request        generate only, never pushes — the "does it still build?" gate
#   push: main          generate and push to the wiki
#   workflow_dispatch   manual republish, e.g. after editing docs/notes
#   workflow_call       called by publish.yml; the caller decides whether to push
#
# Staleness is NOT this workflow's job. tests/test_wiki.py fails when the
# committed pages do not match the generator, and test.yml runs it with the
# submodule checked out — so a pull request that forgot to regenerate fails the
# test suite, where a contributor is already looking.
#
# The wiki is its own git repository at <repo>.wiki.git, and a submodule here at
# docs/ — hence the submodule checkout and the push from inside that directory
# rather than a commit to this repo. The hand-written notes live in there too,
# under docs/notes/, so a note edit shows up as a change to the `docs` pointer.

on:
  pull_request:
    # a draft runs nothing; marking it ready starts the checks
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
    - kubed/**
    - docs
    - scripts/generate_wiki.py
    - .github/workflows/wiki.yml
  # every merge, not only one that changes the pages: after it, the open PRs are brought up
  # to date (the last step), and a merge of any kind leaves them behind
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push:
        description: Push to the wiki
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      push:
        description: Push to the wiki
        type: boolean
        required: false
        default: false
    secrets:
      # Optional, and only consulted by a run that pushes. Without it the
      # built-in GITHUB_TOKEN does the push, which is enough: a wiki lives under
      # its repository's permissions, so `contents: write` covers it. Supply the
      # App key to publish under the App's identity instead, or if a ruleset
      # ever starts refusing the Actions one.
      #
      # There is no client id here to match: it is the GH_CLIENT_ID *variable*,
      # and variables reach a called workflow in the same repository without
      # being passed at all.
      GH_APP_KEY:
        required: false

# One publisher at a time. Two runs racing to push the same generated pages is a
# guaranteed non-fast-forward, and the loser fails for no useful reason.
# cancel-in-progress stays false so a queued run is not killed.
concurrency:
  group: wiki-${{ github.ref }}

jobs:

  wiki:
    name: Publish Wiki
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    permissions:
      contents: write   # the wiki repo lives under this repository's permissions
    env:
      # true only for a real publish: merge to main, or a dispatch/call with
      # push=true. A pull_request run never pushes.
      PUSH: ${{ (github.event_name == 'push' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.push)) && 'true' || 'false' }}
    steps:

    # Only a run that pushes needs a writable identity; a pull_request run just
    # generates and throws the result away.
    #
    # Gated on the variable rather than the key, because the `secrets` context
    # cannot be used in an `if` at all. That works out here: the App is the
    # optional path, so no GH_CLIENT_ID means skip this and let the built-in
    # token push.
    #
    # Same identity as publish.yml — see its `version` job for why this is
    # client-id rather than the deprecated app-id.
    - name: Create GitHub App Token
      id: app-token
      if: env.PUSH == 'true' && vars.GH_CLIENT_ID != ''
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        # The wiki is a repository's own git repo, so a wiki push is a contents
        # write. Without this the token would carry every permission the App is
        # installed with.
        permission-contents: write

    - name: Checkout
      uses: actions/checkout@v7
      with:
        # The wiki submodule is the thing being published, so it has to be here.
        submodules: true
        # Also rewrites the submodule's https:// origin to carry this token, so
        # the checkout and the later push both authenticate with no extra work.
        token: ${{ steps.app-token.outputs.token || github.token }}
        persist-credentials: true

    # A merged branch's pin is on that branch's own wiki branch: kubed-io/actions git/commit
    # pushes a branch's wiki commits there and never to master, which is the public wiki and
    # this job's alone. So the pin is usually beside master, not ahead of it. Master is
    # merged in, the pin's side taking a file both changed: the pages are regenerated from
    # this commit's code next, and the pin carries the branch's specs and plans. A browser
    # edit to master survives the same way.
    - name: Bring the Wiki's Master In
      if: env.PUSH == 'true'
      working-directory: docs
      run: |
        git fetch --quiet --unshallow origin 2>/dev/null || git fetch --quiet origin
        git fetch --quiet origin master
        if git merge-base --is-ancestor FETCH_HEAD HEAD; then
          exit 0
        fi
        git -c user.name="github-actions[bot]" \
          -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          merge --no-edit -X ours -m "Merge the wiki's master into ${GITHUB_SHA:0:8}'s pin" FETCH_HEAD

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    # The generator imports the package to build the spec from the live tool
    # schemas, so the package itself is the dependency, not just a YAML writer.
    - name: Install
      run: pip install .

    - name: Generate
      run: python scripts/generate_wiki.py

    # Two separate questions. `changed`: did regenerating alter the pages.
    # `unpublished`: is the commit the submodule pins ahead of the wiki's master.
    # The second matters because tests/test_wiki.py forces the pinned commit to
    # equal the generator's output, so a merge whose wiki commit was only ever
    # pushed to a branch regenerates nothing and would publish nothing.
    #
    # Only a pin that fast-forwards master is published. If the wiki was edited
    # in the browser, master is ahead of or beside the pin; pushing would be
    # rejected on every merge, so that case warns instead of failing. The
    # submodule checkout is shallow and the wiki is small, so its history is
    # fetched to answer. When `changed` is also true the regeneration commit sits
    # on top of the pin, so that push is as fast-forward-sensitive as it ever was.
    # This has to run before any regeneration commit moves HEAD.
    - name: Diff
      id: diff
      working-directory: docs
      run: |
        remote=$(git ls-remote origin refs/heads/master | cut -f1)
        if [ -n "$remote" ] && [ "$(git rev-parse HEAD)" != "$remote" ]; then
          git fetch --quiet --unshallow origin 2>/dev/null || git fetch --quiet origin
          git fetch --quiet origin master
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
            echo "The pinned wiki commit is ahead of the wiki's master; publishing it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The wiki's master has moved past or beside the pinned commit (edited in the browser?). Not publishing the pin; bump docs/ to include master's changes."
            echo "The wiki's master is not behind the pinned commit; nothing published from the pin." >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
        git add -A
        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "The wiki is already current." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        echo "changed=true" >> "$GITHUB_OUTPUT"
        {
          echo "## Wiki changes"
          echo ""
          echo '```'
          git diff --cached --stat
          echo '```'
          if [[ "$PUSH" != "true" ]]; then
            echo ""
            echo "_Not published — this run does not push._"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Push
      if: env.PUSH == 'true' && (steps.diff.outputs.changed == 'true' || steps.diff.outputs.unpublished == 'true')
      working-directory: docs
      env:
        SHA: ${{ github.sha }}
        CHANGED: ${{ steps.diff.outputs.changed }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Only regeneration makes a commit; an unpublished pin is pushed as it
        # is. A non-fast-forward (the wiki was edited in the browser) is
        # rejected here, loudly, which is the right answer.
        if [ "$CHANGED" = "true" ]; then
          git commit -m "Regenerate from ${SHA:0:8}"
        fi
        # The wiki's default branch is master, not main — GitHub creates it that
        # way and does not follow the repository's own default.
        git push origin HEAD:master

    # The submodule now points at a commit that exists only on the wiki remote: a
    # regeneration, or the merge of master above. Left unrecorded, main pins an older wiki
    # and a fresh clone checks out pages that do not match its code. The path is `docs`.
    # Until 2026-11-13 this step staged `wiki` (copied from mcp-kb, whose submodule is
    # there) and so never recorded anything.
    #
    # Pushed with the App's token through an explicit remote, as mcp-kb does: the App
    # is the identity main's ruleset lets through. It lands on what the branch is NOW, so
    # a merge that came in meanwhile does not make it a non-fast-forward.
    - name: Record the Submodule Pointer
      if: env.PUSH == 'true' && (steps.diff.outputs.changed == 'true' || steps.diff.outputs.unpublished == 'true')
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        pin=$(git -C docs rev-parse HEAD)
        if [ "$(git rev-parse "HEAD:docs")" = "$pin" ]; then
          exit 0
        fi
        if [ -z "$TOKEN" ]; then
          echo "::warning::Wiki published, but the docs pointer was not recorded: no App token (GH_CLIENT_ID unset)."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        remote="https://x-access-token:${TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
        git fetch --quiet origin "$GITHUB_REF_NAME"
        git checkout --quiet -B "$GITHUB_REF_NAME" FETCH_HEAD
        git update-index --cacheinfo "160000,${pin},docs"
        git commit --quiet -m "chore: bump docs submodule [skip ci]"
        git push "$remote" "HEAD:${GITHUB_REF_NAME}"

    # Every open PR into main falls behind each merge, and an agent PR's docs pointer (and often
    # CHANGELOG's [Unreleased]) conflicts with every other's. This brings each one up to date:
    # GitHub's update-branch when it merges clean, otherwise a merge whose docs pointer goes to
    # the wiki's head (which holds every PR's spec and plan) and whose CHANGELOG keeps both sides.
    # Anything else is left for the PR's agent and named in the summary. It pushes as the App,
    # so each PR's checks run again (cluster spec 2026-11-12-agent-flow-parallel-design, R-L9).
    # !cancelled(): it does not depend on the publish above, so a wiki push refused (a browser
    # edit) still leaves the PRs current
    - name: Bring the Open PRs Up to Date
      if: ${{ !cancelled() && github.event_name == 'push' }}
      uses: kubed-io/actions/pr-update@main
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
