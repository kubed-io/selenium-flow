name: 🛡️ Quality

# The scanners: what they find is a code scanning alert, not a failure. Both upload to
# Security → Code scanning, and GitHub posts their findings on the PR as its own CodeQL and
# zizmor checks and as line comments. Neither job fails on a finding; an agent reads the
# alerts (kubed-io/actions/pr-checks) and a new high-severity one blocks the merge by the
# ruleset's code scanning rule, not by this workflow.
#
#   CodeQL            the code scanner — Python source AND the workflows here
#   Workflow Audit    zizmor over .github — CI supply chain and token hygiene
#
# On its own pull_request trigger, not called by pr.yml: code scanning names an analysis
# by its workflow file and job, so main's and a PR's must come from this same file to be
# compared. The gates (Dependency Audit, Dockerfile Lint, OpenAPI Spec) are lint.yml.

on:
  pull_request:
    # a draft runs nothing; marking it ready starts the scans
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # The code scanner. `actions` is in the language list on purpose: this repo's
  # CI handles a Docker Hub credential and a GitHub App key, so the workflows
  # are as much attack surface as the Python is.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Publish findings to Security → Code scanning, and onto the PR.
      security-events: write
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # Both languages are interpreted, so there is nothing to build and CodeQL
    # extracts them directly.
    #
    # Deliberately NO `build-mode: none` here. That input is only valid when a
    # job analyses ONE language — the action rejects it alongside a list — and
    # setting it would trade a correct two-language job for a matrix, two check
    # names, and a required-status-check list that has to name both.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python,actions

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  # ---------------------------------------------------------------------------
  # zizmor audits the CI itself — template injection, over-broad tokens,
  # credential persistence, unreviewed third-party actions. Config and the
  # reasoning behind each relaxation live in .github/zizmor.yml.
  # ---------------------------------------------------------------------------
  actions:
    name: Workflow Audit
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # Advanced Security mode never fails on a finding: it is an alert, on the PR as
    # zizmor's own check and line comments. A FORK's pull request gets a read-only
    # token, so its SARIF upload would 403; there zizmor prints to the log instead,
    # and a finding fails the job.
    - name: Audit Workflows
      uses: zizmorcore/zizmor-action@v0.6.4
      with:
        inputs: .github/
        persona: regular
        advanced-security: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
