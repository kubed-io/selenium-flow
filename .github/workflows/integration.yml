name: 🔌 Integration

# The real server, a real browser, and the server's own admin page as the site
# under test. test.yml never opens a port, which is how the admin list went
# blank in production with every test green.
#
# The flows in tests/integration/flows/ are the tests. Read the "less is more"
# section of CONTRIBUTING.md before adding one.
#
# Not a required check yet: it depends on a browser container, and a flake here
# should be visible without blocking a merge until it has a track record.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  GRID_URL: http://localhost:4444
  # Where the BROWSER reaches the server, which runs on the runner host rather
  # than beside it. host-gateway is Docker's name for that host.
  ADMIN_ORIGIN: http://host.docker.internal:8765
  # Production runs Redis, and the blank admin list only happened on Redis.
  SESSION_STORE: redis
  REDIS_URL: redis://localhost:6379/0

jobs:

  integration:
    name: Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The results and profile comments on the pull request, and the check run.
      checks: write
      pull-requests: write
    services:
      # Pinned to what the cluster's Grid runs, so a pass here is a claim about
      # the browser production uses.
      selenium:
        image: selenium/standalone-chrome:4.48.0-20260905
        ports:
        - 4444:4444
        # The health check is the image's own readiness script: /status answers
        # 200 before the Grid is ready, so a plain curl let tests race startup
        # (Copilot, #33).
        options: >-
          --shm-size 2g
          --add-host host.docker.internal:host-gateway
          --health-cmd "/opt/bin/check-grid.sh --host 0.0.0.0 --port 4444"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
      redis:
        image: redis:7.4.1
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        # setuptools_scm needs history to resolve a version at install time.
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: ui/package-lock.json

    # The flows drive the real admin page, so the placeholder Task 10 falls
    # back to when it is unbuilt is not good enough here.
    - name: Install UI Dependencies
      run: npm --prefix ui ci --no-audit --no-fund
    - name: Build UI
      run: npm --prefix ui run build

    - name: Install
      run: pip install .[test,redis,profile]

    - name: Integration Tests
      run: pytest tests/integration -s --junit-xml=dist/integration-results.xml
      # py-spy records the server for the whole run, MCP and the admin page at
      # once, and test_responsive leaves its timings beside the flamegraph.
      env:
        PROFILE_DIR: dist/profile

    - name: Surface Failing Tests
      if: always()
      uses: pmeier/pytest-results-action@v0.9.0
      with:
        path: dist/integration-results.xml
        summary: true
        display-options: fEX
        fail-on-empty: true

    - name: Publish Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2.24.0
      with:
        check_name: Integration test results
        files: dist/integration-results.xml
        comment_mode: always

    - name: Upload Profile
      id: profile
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-profile
        path: dist/profile/
        if-no-files-found: ignore

    # What the flamegraph says, in numbers, and a link to it: a pull request
    # cannot show an SVG inline. The same markdown goes in the job summary.
    - name: Summarise Profile
      if: always()
      env:
        ARTIFACT_URL: ${{ steps.profile.outputs.artifact-url }}
      run: |
        mkdir -p dist/profile
        python scripts/pr_report.py profile dist/profile "$ARTIFACT_URL" > dist/profile-comment.md
        cat dist/profile-comment.md >> "$GITHUB_STEP_SUMMARY"

    - name: Comment Profile
      if: always() && github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v3.0.5
      with:
        header: integration-profile
        path: dist/profile-comment.md
