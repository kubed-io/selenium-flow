name: 📸 Image Builder

# Context-driven image build:
#   push: main          push :main + :latest          → test :latest in-cluster
#   workflow_dispatch   manual build (push toggle)
#   workflow_call       called by publish.yml with a version tag — checks out
#                       that tag and pushes :vX.Y.Z (stable, pin this to deploy)
#
# There is deliberately NO `pull_request` trigger. A multi-arch build is ~9
# minutes, which is most of a pull request's total wait for a signal that almost
# never differs from what the merge build gives — and the merge build is the one
# whose output anyone actually pulls. The Dockerfile is not unguarded on a PR:
# quality.yml lints it with hadolint, and package.yml builds and installs the
# wheel the image is a wrapper around, so a break in the part that is ours is
# caught in seconds instead of minutes.
#
# There is deliberately NO `push: tags` trigger either. Releases don't rely on a
# tag push triggering a build; publish.yml calls this workflow (workflow_call) so
# the image is on Docker Hub BEFORE the GitHub Release is cut.
#
# This is a public repo, so there is no GCP/WIF hop for credentials — Docker Hub
# creds come straight from the org secrets.

on:
  push:
    branches: [main]
    paths:
    - Dockerfile
    - docker-compose.yaml
    - pyproject.toml
    - .github/workflows/image.yml
    - kubed/**
    # Mapped into the package by [tool.setuptools.package-dir], so they are in
    # the wheel and therefore in the image. Left out of this list, an admin UI
    # or skill change builds nothing and the deployed image silently keeps the
    # old one — which happened. tests/test_packaging.py guards the pairing.
    - static/**
    - skills/**
  workflow_dispatch:
    inputs:
      push:
        description: Push to registry
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      tag:
        description: Git tag to check out and stamp the image with (empty = current ref)
        type: string
        required: false
        default: ''
      push:
        description: Push to registry
        type: boolean
        required: false
        default: false
    # Named rather than inherited. `secrets: inherit` hands a called workflow
    # every secret the repo has, so a change to what this file does with them is
    # invisible at the call site; listing the two it actually needs keeps the
    # blast radius readable from publish.yml.
    secrets:
      DOCKER_USERNAME:
        description: Docker Hub user for the push
        required: false
      DOCKER_PASSWORD:
        description: Docker Hub token for the push
        required: false

# One build at a time per group, and the newest branch build wins. A build takes
# ~9 minutes, so queueing meant waiting out an image for a commit that had
# already been superseded before the one you wanted even started.
#
# Releases are exempt, and that exemption is the point of keying on `tag`.
# publish.yml cuts the version tag BEFORE calling this workflow, so a release
# build cancelled by an ordinary push to main would strand a git tag and a
# GitHub Release on an image that does not exist. Each release gets its own
# group and is never cancelled; only branch builds supersede each other.
concurrency:
  group: image-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ !inputs.tag }}

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # true only for a real registry push: merge to main, or a dispatch/publish
      # with push=true. A dry-run publish builds without pushing.
      PUSH: ${{ (github.event_name == 'push' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.push)) && 'true' || 'false' }}
    environment:
      name: dockerhub
      url: https://hub.docker.com/r/kubed/selenium-flow
    steps:

    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        # publish.yml passes the version tag to lock the build to the released
        # commit; empty for every other event (checks out the triggering ref).
        ref: ${{ inputs.tag }}
        # setuptools_scm derives the version from git history, not just HEAD.
        fetch-depth: 0
        # The build needs no git identity, and a token left in .git/config would
        # be readable by the build context this step is about to hand to Docker.
        persist-credentials: false

    # GIT_TAG is the semantic bake tag: the version on a release (workflow_call),
    # else :latest on a main build.
    - name: Resolve image tag
      shell: bash
      env:
        CALL_TAG: ${{ inputs.tag }}
      run: |
        if [ -n "$CALL_TAG" ]; then
          echo "GIT_TAG=$CALL_TAG" >> "$GITHUB_ENV"
        else
          echo "GIT_TAG=latest" >> "$GITHUB_ENV"
        fi

    # `docker buildx bake` is run from a plain shell step inside build-image, and
    # a shell step does not get ACTIONS_RUNTIME_TOKEN or ACTIONS_RESULTS_URL —
    # those reach JS actions only. Without them buildx's `type=gha` backend is a
    # silent no-op: it neither imports nor exports and says nothing about it.
    # That is why the cache-to/cache-from in docker-compose.yaml had never once
    # produced a CACHED layer, measured across two identical builds in a row.
    #
    # ACTIONS_CACHE_SERVICE_V2 is not optional and is the whole reason this is a
    # list rather than one token. GitHub retired the v1 cache API; without the
    # flag buildx talks v1 anyway and the export dies on an HTML error page it
    # cannot parse — which fails the BUILD, not just the cache. So the v1
    # ACTIONS_CACHE_URL is deliberately not exported at all: there is nothing to
    # fall back to.
    #
    # And if that flag ever disappears, nothing is exported and the build runs
    # uncached, the way it did for months. A cache is an optimisation and must
    # never be able to fail an image build.
    #
    # `crazy-max/ghaction-github-runtime` is the maintained version of this and
    # knows the list; it is not used because it would add a publisher to a set
    # .github/zizmor.yml deliberately keeps short. The trade is that this list
    # is ours to keep correct across GitHub's migrations.
    - name: Expose the Actions runtime to buildx
      uses: actions/github-script@v8
      with:
        script: |
          const v2 = process.env.ACTIONS_CACHE_SERVICE_V2;
          if (!v2) {
            core.warning('No ACTIONS_CACHE_SERVICE_V2: building without a layer cache.');
            return;
          }
          core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL);
          core.exportVariable('ACTIONS_CACHE_SERVICE_V2', v2);

    - name: Build and Push
      uses: kubed-io/actions/build-image@main
      with:
        push: ${{ env.PUSH }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        repository: kubed/selenium-flow
