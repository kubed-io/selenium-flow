name: 📸 Image Builder

# Context-driven image build:
#   push: main          push :main + :latest          → test :latest in-cluster
#   workflow_dispatch   manual build (push toggle); off main, :<branch> + :<sha> only
#   workflow_call       called by publish.yml with a version tag — checks out
#                       that tag and pushes :vX.Y.Z (stable, pin this to deploy)
#
# There is deliberately NO `pull_request` trigger. That reasoning was written
# when a multi-arch build was ~9 minutes; it is ~2m20 now for a source-only
# change, so the cost side of it has largely gone and the trigger is worth
# reconsidering on its own merits. What has not changed is the other half: the
# signal almost never differs from what the merge build gives, and the merge
# build is the one whose output anyone actually pulls. The Dockerfile is not
# unguarded on a PR either:
# quality.yml lints it with hadolint, and package.yml builds and installs the
# wheel the image is a wrapper around, so a break in the part that is ours is
# caught in seconds instead of minutes.
#
# There is deliberately NO `push: tags` trigger either. Releases don't rely on a
# tag push triggering a build; publish.yml calls this workflow (workflow_call) so
# the image is on Docker Hub BEFORE the GitHub Release is cut.
#
# This is a public repo, so there is no GCP/WIF hop for credentials — Docker Hub
# creds come straight from the org secrets.

on:
  push:
    branches: [main]
    paths:
    - Dockerfile
    # What reaches the build context, which is as much a part of the image as
    # the Dockerfile that reads it: stripping a tracked path from here made
    # setuptools_scm call the tree dirty, and v0.2.0 shipped an image reporting
    # 0.2.1.dev0. That change did not rebuild anything, because this list did
    # not watch the file that caused it.
    - .dockerignore
    - docker-compose.yaml
    - pyproject.toml
    - .github/workflows/image.yml
    - kubed/**
    # Mapped into the package by [tool.setuptools.package-dir], so they are in
    # the wheel and therefore in the image. Left out of this list, an admin UI
    # or skill change builds nothing and the deployed image silently keeps the
    # old one — which happened. tests/test_packaging.py guards the pairing.
    # ui/** is the Svelte source the image's own `ui` stage builds — there is
    # no static/ directory to watch any more, it is gitignored build output.
    - ui/**
    - skills/**
    - prompts/**
    - js/**
    # Not in the wheel, but the Dockerfile copies it and it decides which
    # dependencies get installed — so a change here changes the image without
    # changing anything the rules above watch. test_packaging.py now derives
    # this from the Dockerfile's own COPY lines rather than trusting the list.
    - scripts/**
  workflow_dispatch:
    inputs:
      push:
        description: Push to registry
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      tag:
        description: Git tag to check out and stamp the image with (empty = current ref)
        type: string
        required: false
        default: ''
      push:
        description: Push to registry
        type: boolean
        required: false
        default: false
    # Named rather than inherited. `secrets: inherit` hands a called workflow
    # every secret the repo has, so a change to what this file does with them is
    # invisible at the call site; listing the two it actually needs keeps the
    # blast radius readable from publish.yml.
    secrets:
      DOCKER_USERNAME:
        description: Docker Hub user for the push
        required: false
      DOCKER_PASSWORD:
        description: Docker Hub token for the push
        required: false

# One build at a time per group, and the newest branch build wins. A build used
# to take ~9 minutes, so queueing meant waiting out an image for a commit that
# had already been superseded before the one you wanted even started. It is
# ~2m20 warm now, which makes this cheaper rather than unnecessary — a
# superseded build is still wasted, and a cold one still costs minutes.
#
# Releases are exempt, and that exemption is the point of keying on `tag`.
# publish.yml cuts the version tag BEFORE calling this workflow, so a release
# build cancelled by an ordinary push to main would strand a git tag and a
# GitHub Release on an image that does not exist. Each release gets its own
# group and is never cancelled; only branch builds supersede each other.
concurrency:
  group: image-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ !inputs.tag }}

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # true only for a real registry push: merge to main, or a dispatch/publish
      # with push=true. A dry-run publish builds without pushing.
      PUSH: ${{ (github.event_name == 'push' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.push)) && 'true' || 'false' }}
    environment:
      name: dockerhub
      url: https://hub.docker.com/r/kubed/selenium-flow
    steps:

    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        # publish.yml passes the version tag to lock the build to the released
        # commit; empty for every other event (checks out the triggering ref).
        ref: ${{ inputs.tag }}
        # setuptools_scm derives the version from git history, not just HEAD.
        fetch-depth: 0
        # The build needs no git identity, and a token left in .git/config would
        # be readable by the build context this step is about to hand to Docker.
        persist-credentials: false

    # Every tag docker-compose.yaml bakes comes from here, plus GIT_SHA from
    # the build-image action (its GIT_REF is unused: it keeps a branch's last
    # path segment verbatim). Bake drops a repeated tag, so the sets are:
    #   main      :latest :main :<sha>
    #   release   :latest :main :<sha> :vX.Y.Z   (workflow_call from main)
    #   branch    :<branch> :<sha>               never :latest or :main
    # A branch name becomes a valid tag that cannot be mistaken for one a main
    # build or a release owns; the expect lines pin that rule and fail the step
    # if it drifts.
    - name: Resolve image tag
      shell: bash
      env:
        CALL_TAG: ${{ inputs.tag }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        sanitize() {
          local t
          t=$(printf '%s' "$1" | LC_ALL=C tr '[:upper:]' '[:lower:]' \
            | LC_ALL=C sed -e 's/[^a-z0-9._-]/-/g' -e 's/^[.-]*//')
          case "$t" in
            '' | latest | main | v[0-9]*) t="ref-$t" ;;
          esac
          printf '%s' "${t:0:128}"
        }
        expect() {
          local got
          got=$(sanitize "$1")
          if [ "$got" != "$2" ]; then
            echo "::error::tag for '$1' is '$got', expected '$2'"
            exit 1
          fi
        }
        expect feature/locks feature-locks
        expect Optimal_Shape optimal_shape
        expect '-.fix:a b' fix-a-b
        expect latest ref-latest
        expect Main ref-main
        expect v1.2 ref-v1.2
        expect vision vision
        expect "$(printf 'x%.0s' {1..200})" "$(printf 'x%.0s' {1..128})"

        if [ "$REF_NAME" = main ]; then
          ref=main
          latest=latest
        else
          ref=$(sanitize "$REF_NAME")
          latest=$ref
        fi
        {
          echo "IMAGE_TAG=${CALL_TAG:-$ref}"
          echo "IMAGE_REF=$ref"
          echo "IMAGE_LATEST=$latest"
        } >> "$GITHUB_ENV"

    - name: Build and Push
      uses: kubed-io/actions/build-image@main
      with:
        push: ${{ env.PUSH }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        repository: kubed/selenium-flow
