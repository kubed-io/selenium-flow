# Dependabot version updates (security updates are toggled in repo settings,
# not in this file). One entry per package manager active in the repo.
#
# House rules:
# - Weekly cadence: enough to stay current without spamming the queue.
# - Grouped minor + patch per ecosystem; majors stay separate for review.
# - Short cooldown so yanked releases get pulled before they reach us.
# - Commit prefix is distinct per ecosystem so the merge queue reads cleanly.
#
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:

# GitHub Actions: keeps every `uses:` pin across workflows current.
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - github-actions
  # skips the pr.yml changelog gate — dependency bumps still land in release
  # notes via version-bump's PR-based generation.
  - no changelog
  commit-message:
    prefix: ci(deps)
  cooldown:
    # github-actions is not semver-versioned, so only default-days is valid here.
    default-days: 3
  groups:
    actions-minor-patch:
      update-types:
      - minor
      - patch

# pip: fastmcp and the selenium client. The selenium client has to stay
# compatible with the Grid the cluster runs, so majors are left ungrouped.
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - python
  - no changelog
  commit-message:
    prefix: deps(pip)
  cooldown:
    default-days: 3
  groups:
    pip-minor-patch:
      update-types:
      - minor
      - patch

# Docker: the python base image in the Dockerfile.
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - docker
  - no changelog
  commit-message:
    prefix: deps(docker)
  cooldown:
    default-days: 3
  groups:
    docker-minor-patch:
      update-types:
      - minor
      - patch
