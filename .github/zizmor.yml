# zizmor configuration — the CI supply-chain auditor run by quality.yml.
#
# Everything zizmor reports is on by default. This file records the two places
# where the default disagrees with a deliberate decision in this repo, and why.
# A finding that is simply inconvenient does not belong here — it belongs fixed.
#
# Docs: https://docs.zizmor.sh/configuration/
rules:

  # zizmor's blanket policy wants every `uses:` pinned to a commit hash. This
  # repo pins to release TAGS instead, and that is a considered trade, not
  # laziness:
  #
  # - Dependabot keeps tags current on a weekly cadence (.github/dependabot.yml),
  #   and its PRs are readable — `v7.0.0 → v7.0.1` says what changed. A hash bump
  #   says nothing, so it gets rubber-stamped, which is the failure hash-pinning
  #   was supposed to prevent.
  # - Every action used here is from a publisher whose tags are protected:
  #   actions/, github/, pypa/, plus the two org accounts that own the release
  #   path. The tag-mutation attack hash-pinning defends against needs the
  #   publisher's own account.
  #
  # `ref-pin` still fails anything floating — a bare branch like `@main` or an
  # unpinned `@master` — which is the part that actually bites.
  unpinned-uses:
    config:
      policies:
        # kubed-io/actions and duplocloud/version-bump are both referenced at
        # @main and are first-party to this release path, so they are named
        # rather than covered by the blanket rule.
        kubed-io/*: ref-pin
        duplocloud/*: ref-pin
        "*": ref-pin

  # `uses: ./.github/workflows/x.yml` is already the local-path form. zizmor
  # reads the call as a same-repository reference it would rather see written
  # another way; there is no other way to write it that keeps a called workflow
  # in this repo, so the advice has nothing to act on here.
  self-repository:
    ignore:
    - publish.yml
    - pr.yml

  # publish.yml's `version` job is the one checkout that MUST keep its
  # credentials: duplocloud/version-bump commits the rolled changelog and pushes
  # the tag through the git remote that checkout configured. Turning this off
  # would leave the job unable to do the only thing it exists for. It uploads no
  # artifact, so the credential has nowhere to leak to.
  #
  # The agent workflows' approve jobs keep theirs too: an approved spec or plan lands in
  # docs/, the wiki submodule, which only a git push can write (the wiki-commit action).
  # Those jobs run no agent and upload no artifact.
  artipacked:
    ignore:
    - publish.yml
    - agent-issue.yml
    - agent-pr.yml

  # pr.yml calls this repository's own check workflows, and each gets the secrets it would
  # have had on its own `pull_request` trigger: `inherit` passes the same set, so a check
  # that starts using a secret needs no second edit in the caller. A fork's pull_request
  # run gets no secrets either way.
  secrets-inherit:
    ignore:
    - pr.yml

  # `gh release create` in a script step would work, but softprops/action-gh-release
  # is the house standard across every kubed-io repo's publish.yml, and a release
  # body this long is far more legible as a YAML block than as a heredoc inside a
  # shell script. Consistency across the sibling repos is worth more here than
  # dropping one dependency.
  superfluous-actions:
    ignore:
    - publish.yml

  # agent-pr.yml listens to pull_request_target and workflow_run so that everything on
  # the claude runner runs the YAML on main, never a pull request's copy. Each job is
  # gated on the sender's id (Dr K's, or Copilot's reviewer through agent-relay.yml), the
  # PR head must be a branch of this repository, and no step runs the PR's code before
  # that gate. The code job checks out the PR head to change it, and its install steps
  # run the head's build and npm scripts; only Dr K and the App can push branches here.
  # agent-review.yml reads the same way. Its route wakes on workflow_run of pr.yml for every
  # PR, on a hosted runner: it reads the PR and the run, sets the `Agent review` status and
  # dispatches `agent-code`, and runs nothing of the PR. The review job runs for Dr K or the
  # App on a head of this repository, and the review agent reads the checkout and cannot
  # write it.
  dangerous-triggers:
    ignore:
    - agent-pr.yml
    - agent-review.yml
